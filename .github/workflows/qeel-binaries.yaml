# Qeel: builds the sandbox-agent server (with the omp agent) as standalone
# binaries and attaches them to the GitHub Release named after the tag:
#   sandbox-agent-<target>   (raw executable, no archive)
# Targets: aarch64/x86_64 apple-darwin (cross-compiled with osxcross) and
# aarch64/x86_64 unknown-linux-musl. Uses upstream's docker/release/build.sh.
# Push a tag like v0.5.6-qeel.2 on the qeel branch, or run manually with the tag.
name: qeel-binaries

on:
  push:
    tags: ["v*-qeel.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.5.6-qeel.2"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create the release if absent
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes "Qeel build of Sandbox Agent. Binaries: sandbox-agent-<target>."
          fi

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: ubuntu-24.04
          - target: x86_64-apple-darwin
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        working-directory: sandbox-agent
        run: |
          docker/release/build.sh "${{ matrix.target }}" "${TAG#v}"
          ls -la dist/
      - name: Upload to the release
        working-directory: sandbox-agent
        run: |
          gh release upload "$TAG" "dist/sandbox-agent-${{ matrix.target }}" \
            -R "$GITHUB_REPOSITORY" --clobber
